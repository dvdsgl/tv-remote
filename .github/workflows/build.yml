name: Build

# Every push to main that touches the app builds, tests and publishes a signed release:
# version 1.0.<run number>, with the APK attached as Remote.apk (so
# releases/latest/download/Remote.apk always gets the newest). Pull requests only build
# and test.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        id: key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No release key; building without publishing."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test and build
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testOssDebugUnitTest assembleOssRelease
          cp app/build/outputs/apk/oss/release/app-oss-release.apk "$RUNNER_TEMP/Remote.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Remote-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/Remote.apk

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "$RUNNER_TEMP/Remote.apk" \
            --target "$GITHUB_SHA" --title "Remote $VERSION_NAME" --latest \
            --notes "$(git log -1 --format=%B "$GITHUB_SHA" | grep -v '^Co-Authored-By:')"
